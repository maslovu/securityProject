apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  namespace: default
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway-container
          # Название вашего локального Docker-образа
          image: com.maslov/security-project-gateway:latest
          imagePullPolicy: Never # 👈 Важно для Docker Desktop: берет образ из локального кэша Docker, а не из интернета

          ports:
            - containerPort: 8082
              name: gateway-port

          env:
            # Указываем ISSUER так, как его видит ваш компьютер снаружи кластера:
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://localhost:30090/realms/maslov-realm"

            # Оставляем только эту строку для проверки подписи:
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: "http://keycloak-service:8080/realms/maslov-realm/protocol/openid-connect/certs"
            # Перенаправляем шлюз на внутренний сервис книг в k8s
            - name: BOOKS_SERVICE_URL
              value: "http://api-app-service:8080"

          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 20 # Уменьшил время для быстрой локальной отладки
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: default
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8089       # Этот порт откроется на вашем localhost компьютера
      targetPort: 8082 # На этот порт сервис перенаправит трафик внутри пода
  type: LoadBalancer   # 🌟 Магия Docker Desktop: делает шлюз доступным снаружи